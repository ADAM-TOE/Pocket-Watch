# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - pocket-watch2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Build client (Vite -> client/dist)
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Build and test server (tsc -> server/dist, run test gate)
        working-directory: server
        run: |
          npm ci
          npm run build
          npm test

      - name: Assemble client into server/public
        working-directory: server
        run: npm run copy:client

      - name: Drop node_modules so Oryx installs (native better-sqlite3) on Linux
        working-directory: server
        run: rm -rf node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D6664DBD98494C58AEBEB6062B67ED99 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_03736A7A352D4E178A98BB4D977B20B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4DDE26C80A3C425F9260EB9D3EF4BB8B }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pocket-watch2'
          slot-name: 'Production'
          package: .
          